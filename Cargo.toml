[package]
name = "Stocks"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_9"] }
async-channel = "2.5.0"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_22"] }
reqwest = "0.13.5"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[build-dependencies]
glib-build-tools = "0.22.8"
