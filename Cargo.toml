[package]
name = "Stocks"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_10"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_24"] }
jiff = "0.2.38"
reqwest = "0.13.5"
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }

[build-dependencies]
glib-build-tools = "0.22.8"
